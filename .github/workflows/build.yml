name: Build Focale packages
run-name: Build Focale ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Focale source release tag
        required: true
        type: string
      source_sha:
        description: Full immutable source commit supplied by the private workflow
        required: true
        type: string
      prerelease:
        description: Mark the public GitHub release as a pre-release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: focale-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'focale-editor/get-focale' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: private-source
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate requested source identity
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 tool/ci/build_identity.py validate-inputs
      - uses: actions/checkout@v7
        with:
          repository: focale-editor/focale
          ref: refs/tags/${{ inputs.tag }}
          path: source
          token: ${{ secrets.FOCALE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - id: identity
        name: Pin source and record public build provenance
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: python3 tool/ci/build_identity.py record --source source
      - uses: actions/upload-artifact@v7
        with:
          name: build-provenance
          path: build-provenance.json
          if-no-files-found: error
          retention-days: 30

  # Later jobs reuse this job's checkout and Flutter steps through YAML anchors.
  sources:
    needs: prepare
    environment: private-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout-source
        uses: actions/checkout@v7
        with:
          repository: focale-editor/focale
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.FOCALE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - &setup-flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Never expose private Git dependencies or generated sources in caches.
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Prepare reviewed third-party notices and corresponding sources
        env:
          SOURCE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tool/distribution/release_pipeline/release_pipeline.py third-party-sources --tag "$SOURCE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-sources
          path: |
            build/distribution/third-party-sources/*.zip
            build/distribution/third-party-sources/legal.json
          if-no-files-found: error
          retention-days: 7

  # Builds do not consume the source bundle, so they start alongside it.
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            # Keep the native library baseline below the latest runner image.
            runner: ubuntu-24.04
          - target: windows-x64
            runner: windows-2025-vs2026
          - target: macos-arm64
            runner: macos-26
          - target: macos-x64
            runner: macos-26-intel
    environment: private-source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - *checkout-source
      - *setup-flutter
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ cmake ninja-build pkg-config libgtk-3-dev libcurl4-openssl-dev librsvg2-bin
      - if: runner.os == 'macOS'
        name: Prepare optional Apple signing and notarization
        env:
          FOCALE_MACOS_P12_BASE64: ${{ secrets.FOCALE_MACOS_P12_BASE64 }}
          FOCALE_MACOS_P12_PASSWORD: ${{ secrets.FOCALE_MACOS_P12_PASSWORD }}
          FOCALE_MACOS_IDENTITY: ${{ secrets.FOCALE_MACOS_IDENTITY }}
          FOCALE_APPLE_ID: ${{ secrets.FOCALE_APPLE_ID }}
          FOCALE_APPLE_TEAM_ID: ${{ secrets.FOCALE_APPLE_TEAM_ID }}
          FOCALE_APPLE_APP_PASSWORD: ${{ secrets.FOCALE_APPLE_APP_PASSWORD }}
        run: bash tool/distribution/setup_macos_signing/setup_macos_signing.sh
      - name: Build archive and installer
        env:
          SOURCE_TAG: ${{ needs.prepare.outputs.tag }}
          DISTRIBUTION_TARGET: ${{ matrix.target }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED || 'true' }}
          SENTRY_ENVIRONMENT: production
          FOCALE_MACOS_IDENTITY: ${{ secrets.FOCALE_MACOS_IDENTITY }}
          FOCALE_WINDOWS_PFX_BASE64: ${{ secrets.FOCALE_WINDOWS_PFX_BASE64 }}
          FOCALE_WINDOWS_PFX_PASSWORD: ${{ secrets.FOCALE_WINDOWS_PFX_PASSWORD }}
        shell: bash
        run: python tool/distribution/release_pipeline/release_pipeline.py build --target "$DISTRIBUTION_TARGET" --tag "$SOURCE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            build/distribution/${{ matrix.target }}/*.zip
            build/distribution/${{ matrix.target }}/*.dmg
            build/distribution/${{ matrix.target }}/*-setup.exe
            build/distribution/${{ matrix.target }}/release.json
            build/distribution/${{ matrix.target }}/distribution.json
          if-no-files-found: error
          retention-days: 7

  # Packages delivered and updated by a store or a Linux package manager.
  build-managed:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # Snap and Mac App Store builds stay off until their variable enables them.
        target: >-
          ${{ fromJSON(format('["windows-store-x64","flatpak-x64"{0}{1}]',
          vars.FOCALE_SNAP_BUILD == 'true' && ',"snap-x64"' || '',
          vars.FOCALE_MAC_STORE_BUILD == 'true' && ',"macos-store-universal"' || '')) }}
    environment: private-source
    runs-on: >-
      ${{ matrix.target == 'windows-store-x64' && 'windows-2025-vs2026' ||
      matrix.target == 'macos-store-universal' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - *checkout-source
      - *setup-flutter
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - if: matrix.target == 'flatpak-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree desktop-file-utils appstream rsync
      - if: matrix.target == 'snap-x64'
        name: Prepare the Ubuntu 24.04 Snap toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ cmake ninja-build pkg-config libgtk-3-dev libwayland-dev libcurl4-openssl-dev libssl-dev squashfs-tools
          sudo snap install snapcraft --classic --channel=8.x/stable
          python -m pip install -r tool/distribution/snap/requirements.txt
      - name: Build package without the direct updater
        env:
          SOURCE_TAG: ${{ needs.prepare.outputs.tag }}
          DISTRIBUTION_TARGET: ${{ matrix.target }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED || 'true' }}
          SENTRY_ENVIRONMENT: production
          # Only the Mac App Store package reads these signing credentials.
          FOCALE_MAC_STORE_P12_BASE64: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_MAC_STORE_P12_BASE64 || '' }}
          FOCALE_MAC_STORE_P12_PASSWORD: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_MAC_STORE_P12_PASSWORD || '' }}
          FOCALE_MAC_STORE_APP_IDENTITY: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_MAC_STORE_APP_IDENTITY || '' }}
          FOCALE_MAC_STORE_INSTALLER_IDENTITY: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_MAC_STORE_INSTALLER_IDENTITY || '' }}
          FOCALE_MAC_STORE_APP_PROFILE_BASE64: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_MAC_STORE_APP_PROFILE_BASE64 || '' }}
          FOCALE_MAC_STORE_QUICKLOOK_PROFILE_BASE64: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_MAC_STORE_QUICKLOOK_PROFILE_BASE64 || '' }}
          FOCALE_MACOS_P12_BASE64: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_MACOS_P12_BASE64 || '' }}
          FOCALE_MACOS_P12_PASSWORD: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_MACOS_P12_PASSWORD || '' }}
          FOCALE_MACOS_IDENTITY: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_MACOS_IDENTITY || '' }}
          FOCALE_APPLE_TEAM_ID: ${{ matrix.target == 'macos-store-universal' && secrets.FOCALE_APPLE_TEAM_ID || '' }}
        shell: bash
        run: python tool/distribution/release_pipeline/release_pipeline.py build-managed --target "$DISTRIBUTION_TARGET" --tag "$SOURCE_TAG"
      - if: matrix.target == 'flatpak-x64'
        name: Preserve OSTree files in a tar archive
        run: tar -czf build/distribution/flatpak-x64/unsigned-repo.tar.gz -C build/distribution/flatpak-x64 repo
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          # Each target produces exactly one of these package kinds.
          path: |
            build/distribution/${{ matrix.target }}/managed.json
            build/distribution/${{ matrix.target }}/*.msix
            build/distribution/${{ matrix.target }}/*.snap
            build/distribution/${{ matrix.target }}/*.pkg
            build/distribution/${{ matrix.target }}/unsigned-repo.tar.gz
          if-no-files-found: error
          # Store retries can reuse a build for up to a month.
          retention-days: 30
